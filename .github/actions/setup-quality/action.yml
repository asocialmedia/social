name: Setup quality checks
description: Restore exact dependencies, generate the Prisma contract, and optionally install media test tools.
inputs:
  ffmpeg:
    description: Install ffmpeg for media tests.
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Bun
      id: setup-bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version-file: package.json

    - name: Get bun store path
      id: bun-cache
      shell: bash
      run: |
        echo "store_path=$(bun pm cache dir)" >> "$GITHUB_OUTPUT"

    - name: Restore Bun cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      id: bun-cache-restore
      with:
        path: |
          ${{ steps.bun-cache.outputs.store_path }}
          ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.setup-bun.outputs.bun-version }}-store-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.setup-bun.outputs.bun-version }}-store-

    - name: Restore node_modules
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      id: node-modules-restore
      with:
        path: |
          **/node_modules
          !**/node_modules/.cache
        key: ${{ runner.os }}-${{ runner.arch }}-node-modules-v3-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bunfig.toml') }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/package.json') }}

    - name: Restore Turbo cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: .turbo
        key: ${{ runner.os }}-${{ runner.arch }}-turbo-v3-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-turbo-v3-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json') }}-

    - name: Restore Prisma cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ~/.cache/prisma
        key: ${{ runner.os }}-${{ runner.arch }}-prisma-v2-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/contract.prisma') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-prisma-v2-${{ hashFiles('bun.lock') }}-

    - name: Install dependencies
      if: steps.node-modules-restore.outputs.cache-hit != 'true'
      shell: bash
      run: bun install --frozen-lockfile

    - name: Generate Prisma contract
      shell: bash
      run: bun run db:gen
    - name: Install ffmpeg
      if: inputs.ffmpeg == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
