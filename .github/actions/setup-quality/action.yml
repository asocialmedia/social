name: Setup quality checks
description: Restore exact dependencies, generate the Prisma contract, and optionally install test tools.
inputs:
  ffmpeg:
    description: Install ffmpeg for media tests.
    default: "false"
  postgresql-client:
    description: Install psql for database setup.
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Bun
      id: setup-bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version-file: package.json

    - name: Get bun store path
      id: bun-cache
      shell: bash
      run: |
        echo "store_path=$(bun pm cache dir)" >> "$GITHUB_OUTPUT"

    - name: Restore Bun cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      id: bun-cache-restore
      with:
        path: |
          ${{ steps.bun-cache.outputs.store_path }}
          ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.setup-bun.outputs.bun-version }}-store-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.setup-bun.outputs.bun-version }}-store-

    - name: Restore node_modules
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      id: node-modules-restore
      with:
        path: |
          **/node_modules
          !**/node_modules/.cache
        key: ${{ runner.os }}-${{ runner.arch }}-node-modules-v3-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bunfig.toml') }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/package.json') }}

    - name: Restore Turbo cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: .turbo
        key: ${{ runner.os }}-${{ runner.arch }}-turbo-v3-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-turbo-v3-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json') }}-

    - name: Restore Prisma cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ~/.cache/prisma
        key: ${{ runner.os }}-${{ runner.arch }}-prisma-v2-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/contract.prisma') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-prisma-v2-${{ hashFiles('bun.lock') }}-

    - name: Install dependencies
      if: steps.node-modules-restore.outputs.cache-hit != 'true'
      shell: bash
      run: bun install --frozen-lockfile

    - name: Generate Prisma contract
      shell: bash
      run: bun run db:gen
    - name: Install test tools from Ubuntu over HTTPS
      if: inputs.ffmpeg == 'true' || inputs.postgresql-client == 'true'
      shell: bash
      env:
        INSTALL_FFMPEG: ${{ inputs.ffmpeg }}
        INSTALL_POSTGRESQL_CLIENT: ${{ inputs.postgresql-client }}
      run: |
        packages=()
        if [[ "$INSTALL_FFMPEG" == true ]] && ! (command -v ffmpeg && command -v ffprobe); then
          packages+=(ffmpeg)
        fi
        if [[ "$INSTALL_POSTGRESQL_CLIENT" == true ]] && ! command -v psql; then
          packages+=(postgresql-client)
        fi
        if (( ${#packages[@]} == 0 )); then
          exit 0
        fi

        source /etc/os-release
        sources="$(mktemp --suffix=.sources)"
        trap 'rm -f "$sources"' EXIT
        chmod 644 "$sources"
        cat > "$sources" <<EOF
        Types: deb
        URIs: https://archive.ubuntu.com/ubuntu/
        Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates
        Components: main restricted universe multiverse
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

        Types: deb
        URIs: https://security.ubuntu.com/ubuntu/
        Suites: ${VERSION_CODENAME}-security
        Components: main restricted universe multiverse
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        EOF
        apt_options=(
          -o "Dir::Etc::sourcelist=$sources"
          -o Dir::Etc::sourceparts=-
          -o Acquire::Retries=2
          -o Acquire::https::Timeout=15
          -o Acquire::Languages=none
        )
        sudo timeout 120s apt-get "${apt_options[@]}" update --error-on=any
        sudo timeout 180s apt-get "${apt_options[@]}" install -y --no-install-recommends "${packages[@]}"
