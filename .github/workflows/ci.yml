name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and Typecheck
    needs: detect-pr-merge
    if: ${{ always() && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-pr-merge.outputs.quality-already-passed == 'true') }}
    runs-on: ubuntu-latest
    # The unit tests exercise the real Redis-backed caches (search history),
    # so provision a throwaway instance matching the local dev default.
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Get bun store path
        id: bun-cache
        shell: bash
        run: |
          echo "store_path=$(bun pm cache dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Bun cache
        uses: actions/cache@v5
        id: bun-cache-restore
        with:
          path: |
            ${{ steps.bun-cache.outputs.store_path }}
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Restore node_modules
        uses: actions/cache@v5
        id: node-modules-restore
        with:
          path: |
            **/node_modules
            !**/node_modules/.cache
          key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-node-modules-

      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Restore Prisma cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('**/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-prisma-

      - name: Install dependencies
        if: steps.node-modules-restore.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run --filter=@asm/db db:generate

      - name: Check lint/format
        run: bun run check

      - name: Check types
        run: bun run check-types

      - name: Install ffmpeg
        # The media-processing scrub tests drive the real ffmpeg/ffprobe
        # binaries, which the hosted runners do not ship by default.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run unit tests
        run: bun run test

  detect-pr-merge:
    name: Detect merged PR push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.pr-check.outputs.should-build }}
      merge-pr-number: ${{ steps.pr-check.outputs.pr-number }}
      quality-already-passed: ${{ steps.pr-check.outputs.quality-already-passed }}
    steps:
      # The script below lives in the repository, so it must be checked out:
      # each job gets a fresh, empty workspace.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether commit came from merged PR
        id: pr-check
        uses: actions/github-script@v8
        with:
          script: |
            const detectPrMerge = require('./.github/scripts/detect-pr-merge.cjs')
            await detectPrMerge({ github, context, core })

  determine-build-matrix:
    name: Determine changed app images
    needs: detect-pr-merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-pr-merge.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed-apps.outputs.matrix }}
      has-app-changes: ${{ steps.changed-apps.outputs.has-app-changes }}
      has-mobile-changes: ${{ steps.changed-apps.outputs.has-mobile-changes }}
      selected-apps: ${{ steps.changed-apps.outputs.selected-apps }}
    steps:
      # The script below lives in the repository, so it must be checked out:
      # each job gets a fresh, empty workspace.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve changed apps from merged PR
        id: changed-apps
        uses: actions/github-script@v8
        with:
          script: |
            const determineBuildMatrix = require('./.github/scripts/determine-build-matrix.cjs')
            await determineBuildMatrix({
              github,
              context,
              core,
              prNumber: Number('${{ needs.detect-pr-merge.outputs.merge-pr-number }}'),
            })

  build-and-push:
    name: Build and Push (${{ matrix.app }})
    needs:
      - quality
      - detect-pr-merge
      - determine-build-matrix
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.quality.result == 'success' || needs.quality.result == 'skipped') && needs.detect-pr-merge.outputs.should-build == 'true' && needs.determine-build-matrix.outputs.has-app-changes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.determine-build-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Print merged PR context
        run: |
          echo "Building Docker images for merged PR #${{ needs.detect-pr-merge.outputs.merge-pr-number }}"
          echo "Commit: ${{ github.sha }}"

      - name: Read app version metadata
        id: version
        run: bash scripts/ci/app-version.sh "${{ matrix.app }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag_name }}
            type=sha,prefix=${{ matrix.app }}-sha-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ steps.version.outputs.app_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.asm.app=${{ matrix.app }}
            io.asm.app-version=${{ steps.version.outputs.app_version }}
            io.asm.root-version=${{ steps.version.outputs.root_version }}
            io.asm.pr-number=${{ needs.detect-pr-merge.outputs.merge-pr-number }}

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.app == 'web' && 'NEXT_PUBLIC_URL=https://asocialmedia.cc' || '' }}
            ${{ matrix.app == 'web' && 'NEXT_PUBLIC_AUTH_URL=https://auth.asocialmedia.cc' || '' }}
            ${{ matrix.app == 'web' && 'NEXT_PUBLIC_TURNSTILE_SITE_KEY=0x4AAAAAAEuKQSsPABv2HAdA' || '' }}

      - name: Resolve deploy targets
        id: deploy-targets
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_WEB_APP_ID: ${{ secrets.DOKPLOY_WEB_APP_ID }}
          DOKPLOY_AUTH_APP_ID: ${{ secrets.DOKPLOY_AUTH_APP_ID }}
          DOKPLOY_MEDIA_APP_ID: ${{ secrets.DOKPLOY_MEDIA_APP_ID }}
          WEB_HEALTH_URL: ${{ secrets.WEB_HEALTH_URL }}
          AUTH_HEALTH_URL: ${{ secrets.AUTH_HEALTH_URL }}
          MEDIA_HEALTH_URL: ${{ secrets.MEDIA_HEALTH_URL }}
        run: bash scripts/ci/resolve-deploy-targets.sh "${{ matrix.app }}"

      - name: Trigger Dokploy deployment via API
        if: success() && steps.deploy-targets.outputs.deploy_enabled == 'true'
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_APP_ID: ${{ steps.deploy-targets.outputs.app_id }}
        run: bash scripts/ci/dokploy-deploy.sh

      - name: Trigger worker deployment via API
        if: success() && matrix.app == 'auth'
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_WORKER_APP_ID }}
        run: bash scripts/ci/dokploy-deploy.sh

      # Fire-and-forget observability only. The edge blocks everything but
      # app traffic, so GitHub runners can never reach the public health URL;
      # Dokploy's own container healthcheck gates rollout. This probe must
      # therefore never fail the workflow.
      - name: Observe deployment health (non-blocking)
        if: success() && steps.deploy-targets.outputs.health_enabled == 'true'
        continue-on-error: true
        env:
          HEALTH_URL: ${{ steps.deploy-targets.outputs.health_url }}
          HEALTH_INITIAL_DELAY: ${{ steps.deploy-targets.outputs.health_initial_delay }}
          HEALTH_RETRIES: ${{ steps.deploy-targets.outputs.health_retries }}
          HEALTH_RETRY_INTERVAL: ${{ steps.deploy-targets.outputs.health_retry_interval }}
        run: bash scripts/ci/observe-health.sh

  cleanup-old-images:
    name: Cleanup old GHCR images
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - asm-web
          - asm-auth
    steps:
      - name: Delete old package versions (keep last 10)
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}

  prisma-sync:
    name: Prisma schema sync
    needs:
      - quality
      - detect-pr-merge
      - determine-build-matrix
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.quality.result == 'success' || needs.quality.result == 'skipped') && needs.detect-pr-merge.outputs.should-build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      should-run: ${{ steps.resolve-prisma.outputs.should-run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve whether Prisma schema sync should run
        id: resolve-prisma
        uses: actions/github-script@v9
        with:
          script: |
            const resolvePrismaSync = require('./.github/scripts/resolve-prisma-sync.cjs')
            await resolvePrismaSync({
              github,
              context,
              core,
              prNumber: Number('${{ needs.detect-pr-merge.outputs.merge-pr-number }}'),
            })

      - name: Print Prisma sync context
        if: steps.resolve-prisma.outputs.should-run == 'true'
        run: |
          echo "Building Prisma sync image for merged PR #${{ needs.detect-pr-merge.outputs.merge-pr-number }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ steps.resolve-prisma.outputs.needed-files }}"

      - name: Read version metadata
        id: version
        if: steps.resolve-prisma.outputs.should-run == 'true'
        run: bash scripts/ci/root-version.sh

      - name: Set up QEMU
        if: steps.resolve-prisma.outputs.should-run == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.resolve-prisma.outputs.should-run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.resolve-prisma.outputs.should-run == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        if: steps.resolve-prisma.outputs.should-run == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/asm-prisma-sync
          tags: |
            type=raw,value=${{ steps.version.outputs.tag_name }}
            type=sha,prefix=prisma-sync-sha-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Asocialmedia Prisma Schema Sync
            org.opencontainers.image.version=${{ steps.version.outputs.root_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.asm.app=prisma-sync
            io.asm.root-version=${{ steps.version.outputs.root_version }}
            io.asm.pr-number=${{ needs.detect-pr-merge.outputs.merge-pr-number }}

      - name: Build and push Prisma sync image (multi-arch)
        if: steps.resolve-prisma.outputs.should-run == 'true'
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=prisma-sync
          cache-to: type=gha,mode=max,scope=prisma-sync
          context: .
          file: docker/prisma-sync.dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy Prisma sync and wait for completion
        if: steps.resolve-prisma.outputs.should-run == 'true'
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_PRISMA_APP_ID: ${{ secrets.DOKPLOY_PRISMA_APP_ID }}
        run: bash scripts/ci/prisma-sync-deploy.sh

  build-mobile-apk:
    name: Build Android APK
    needs:
      - quality
      - detect-pr-merge
      - determine-build-matrix
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.quality.result == 'success' || needs.quality.result == 'skipped') && needs.detect-pr-merge.outputs.should-build == 'true' && needs.determine-build-matrix.outputs.has-mobile-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Get bun store path
        id: bun-cache
        shell: bash
        run: |
          echo "store_path=$(bun pm cache dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.bun-cache.outputs.store_path }}
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Restore node_modules
        uses: actions/cache@v5
        id: node-modules-restore
        with:
          path: |
            **/node_modules
            !**/node_modules/.cache
          key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.node-modules-restore.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Prebuilds the native project, provisions the release keystore, injects
      # release signing, builds the arm64-v8a APK, verifies the signature and
      # packages the artifact with its checksum. A release channel must be
      # signed with a stable production key, so a missing keystore fails the
      # build rather than publishing an unsigned APK.
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Metro inlines EXPO_PUBLIC_* into the JS bundle at build time, so
          # everything here is public inside the shipped APK. An unset entry
          # resolves to an empty string, letting the app's own defaults (or its
          # "no telemetry" path) take over - so these are safe to leave unset.
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_OTEL_ENDPOINT: ${{ vars.EXPO_PUBLIC_OTEL_ENDPOINT }}
          # Ingestion-only credential: must be able to write telemetry and
          # nothing else. Never an account credential.
          EXPO_PUBLIC_OTEL_TOKEN: ${{ secrets.EXPO_PUBLIC_OTEL_TOKEN }}
        run: bun apps/mobile/scripts/build-android-apk.ts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: |
            build-artifacts/*.apk
            build-artifacts/*.sha256
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs:
      - quality
      - detect-pr-merge
      - determine-build-matrix
      - build-and-push
      - prisma-sync
      - build-mobile-apk
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.quality.result == 'success' || needs.quality.result == 'skipped') && needs.detect-pr-merge.outputs.should-build == 'true' && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') && (needs.prisma-sync.result == 'success' || needs.prisma-sync.result == 'skipped') && (needs.build-mobile-apk.result == 'success' || needs.build-mobile-apk.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Download mobile APK artifact
        if: needs.determine-build-matrix.outputs.has-mobile-changes == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mobile-apk
          path: build-artifacts

      - name: Collect PR and commit metadata
        id: collect-meta
        uses: actions/github-script@v8
        with:
          script: |
            const collectReleaseMetadata = require('./.github/scripts/collect-release-metadata.cjs')
            await collectReleaseMetadata({
              github,
              context,
              core,
              prNumber: Number('${{ needs.detect-pr-merge.outputs.merge-pr-number }}'),
            })

      - name: Generate release notes
        id: release-notes
        env:
          PR_NUMBER: ${{ needs.detect-pr-merge.outputs.merge-pr-number }}
          PR_TITLE: ${{ steps.collect-meta.outputs.pr_title }}
          PR_URL: ${{ steps.collect-meta.outputs.pr_url }}
          COMMITS_JSON: ${{ steps.collect-meta.outputs.commits_json }}
          AUTHORS_JSON: ${{ steps.collect-meta.outputs.authors_json }}
          SELECTED_APPS: ${{ needs.determine-build-matrix.outputs.selected-apps }}
          PRISMA_SYNC_BUILT: ${{ needs.prisma-sync.outputs.should-run }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          ARTIFACT_DIR: build-artifacts
          OUTPUT_FILE: release-notes.md
        run: bun scripts/release/prepare-release-metadata.ts

      - name: Publish GitHub Release
        # Pinned to the reviewed v2.6.2 commit: this job holds `contents: write`
        # and hands the action its token, so a repointed mutable tag would let
        # upstream code rewrite this repository's tags and releases.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.release-notes.outputs.tag_name }}
          name: Release ${{ steps.release-notes.outputs.tag_name }}
          body_path: ${{ steps.release-notes.outputs.notes_path }}
          draft: false
          prerelease: false
          files: |
            build-artifacts/*.apk
            build-artifacts/*.sha256
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
