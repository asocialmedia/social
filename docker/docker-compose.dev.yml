name: asmdev

services:
  postgres-dev:
    container_name: asmdb
    image: postgres:18.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asocialmedia
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    command: >
      postgres -c listen_addresses='*' -c max_connections=50 -c shared_buffers=128MB -c work_mem=4MB -c maintenance_work_mem=32MB -c effective_cache_size=256MB -c wal_level=replica -c max_wal_senders=4 -c log_statement=none -c timezone=UTC
    networks:
      - dev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asocialmedia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres-init:
    profiles: ["init"]
    container_name: asmdev-db-init
    image: postgres:18.3
    environment:
      PGPASSWORD: postgres
    networks:
      - dev_network
    depends_on:
      postgres-dev:
        condition: service_healthy
    command: >
      sh -c '
        echo "Initializing PostgreSQL extensions..." &&
        psql -h postgres-dev -U postgres -d asocialmedia -c "
          CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
          CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";
          CREATE EXTENSION IF NOT EXISTS \"pg_stat_statements\";
          ALTER DATABASE asocialmedia SET timezone TO '\''UTC'\'';
        " &&
        echo "PostgreSQL initialization complete!"
      '

  prisma-migrate:
    profiles: ["init"]
    container_name: asmdev-schema-init
    build:
      context: ..
      dockerfile: docker/prisma.dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-dev:5432/asocialmedia?schema=public
    networks:
      - dev_network
    depends_on:
      postgres-dev:
        condition: service_healthy
    command: ["/usr/local/bin/prisma-bootstrap.sh"]

  prisma-studio:
    profiles: ["studio", "init"]
    container_name: asmdev-prisma-studio
    build:
      context: ..
      dockerfile: docker/prisma.dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-dev:5432/asocialmedia?schema=public
    ports:
      - "5555:5555"
    networks:
      - dev_network
    depends_on:
      postgres-dev:
        condition: service_healthy
    command: ["/usr/local/bin/prisma-studio.sh"]
    restart: unless-stopped

  redis-dev:
    container_name: asmdev-redis
    image: redis:8.6.2
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server --requirepass asmredis --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec --loglevel notice --save 900 1
    volumes:
      - redis_data_dev:/data
    networks:
      - dev_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "asmredis", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  redis-insight:
    profiles: ["studio"]
    container_name: asmdev-redis-insight
    image: redislabs/redisinsight:latest
    ports:
      - "5540:5540"
    environment:
      - RI_REDIS_HOST=redis-dev
      - RI_REDIS_PORT=6379
      - RI_REDIS_PASSWORD=asmredis
      - RI_REDIS_ALIAS=Zephyr Redis Dev
    volumes:
      - redisinsight:/data
    networks:
      - dev_network
    depends_on:
      redis-dev:
        condition: service_healthy
    restart: unless-stopped

  asmob-dev:
    container_name: asmdev-asmob
    image: rustfs/rustfs:latest
    ports:
      - "9090:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${ASMOB_ROOT_USER:-asmob-admin}
      RUSTFS_SECRET_KEY: ${ASMOB_ROOT_PASSWORD:-asmob-admin}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_REGION: ${ASMOB_REGION:-ap-south-1}
    volumes:
      - asmob_data_dev:/data
    networks:
      - dev_network
    command: rustfs --address 0.0.0.0:9000 /data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  asmob-init:
    profiles: ["init"]
    container_name: asmdev-asmob-init
    image: amazon/aws-cli:2.17.53
    depends_on:
      asmob-dev:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${ASMOB_ROOT_USER:-asmob-admin}
      AWS_SECRET_ACCESS_KEY: ${ASMOB_ROOT_PASSWORD:-asmob-admin}
      AWS_DEFAULT_REGION: ${ASMOB_REGION:-ap-south-1}
      ASMOB_ENDPOINT: http://asmob-dev:9000
    networks:
      - dev_network
    entrypoint:
      - /bin/sh
      - -ec
      - |
        echo 'Creating object storage buckets...'
        aws --endpoint-url "$$ASMOB_ENDPOINT" s3api create-bucket --bucket uploads || true
        aws --endpoint-url "$$ASMOB_ENDPOINT" s3api create-bucket --bucket avatars || true
        aws --endpoint-url "$$ASMOB_ENDPOINT" s3api create-bucket --bucket temp || true
        aws --endpoint-url "$$ASMOB_ENDPOINT" s3api create-bucket --bucket backups || true

        # Buckets stay private: content is served exclusively through the app's
        # /api/media, /api/users/avatar/[userId]/image and
        # /api/users/banner/[userId]/image proxy routes, which use the S3
        # client with credentials. Never apply public-read policies here.

        echo 'Enabling versioning...'
        aws --endpoint-url "$$ASMOB_ENDPOINT" s3api put-bucket-versioning --bucket uploads --versioning-configuration Status=Enabled || true
        aws --endpoint-url "$$ASMOB_ENDPOINT" s3api put-bucket-versioning --bucket avatars --versioning-configuration Status=Enabled || true
        aws --endpoint-url "$$ASMOB_ENDPOINT" s3api put-bucket-versioning --bucket temp --versioning-configuration Status=Enabled || true
        aws --endpoint-url "$$ASMOB_ENDPOINT" s3api put-bucket-versioning --bucket backups --versioning-configuration Status=Enabled || true

        # Browser-direct presigned uploads (POST /api/upload/initiate) need
        # CORS on the uploads bucket: the browser PUTs straight to storage.
        # Presigning signs against ASMOB_PUBLIC_ENDPOINT when configured, so
        # allow both dev and public origins explicitly.
        echo 'Applying CORS rules for presigned browser uploads...'
        aws --endpoint-url "$$ASMOB_ENDPOINT" s3api put-bucket-cors --bucket uploads --cors-configuration '{
          "CORSRules": [
            {
              "AllowedOrigins": ["https://social.localhost", "http://localhost:3000", "https://asocialmedia.cc", "https://www.asocialmedia.cc"],
              "AllowedMethods": ["PUT", "HEAD", "GET"],
              "AllowedHeaders": ["*"],
              "ExposeHeaders": ["ETag", "Content-Length"],
              "MaxAgeSeconds": 3600
            }
          ]
        }' || true

        echo 'Object storage initialization complete!'

  clamav-dev:
    container_name: asmdev-clamav
    image: clamav/clamav:latest
    environment:
      # INSTREAM cap must exceed the largest upload (250MB default). The
      # image's /init only honors CLAMD_CONF_<ParamName> variables; the
      # CLAMAV_MAX_* names are silently ignored.
      CLAMD_CONF_MaxStreamSize: 300M
      CLAMD_CONF_MaxFileSize: 300M
    ports:
      - "3310:3310"
    volumes:
      - clamav_data_dev:/var/lib/clamav
    networks:
      - dev_network
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  openobserve-dev:
    container_name: asmdev-openobserve
    image: public.ecr.aws/zinclabs/openobserve-enterprise:v0.40.27
    ports:
      - "5080:5080"
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_USER:-root@example.com}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD:-Complexpass#123}
      ZO_DATA_DIR: /data
      ZO_ORGANIZATION: ${OPENOBSERVE_ORG:-default}
      ZO_MEMORY_CACHE_CACHE_SIZE: 128
      ZO_TELEMETRY: "false"
    volumes:
      - openobserve_data_dev:/data
    networks:
      - dev_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  dev_network:
    driver: bridge
    name: asmdev-network

volumes:
  postgres_data_dev:
    name: asmdev-postgres18-data
  redis_data_dev:
    name: asmdev-redis-data
  asmob_data_dev:
    name: asmdev-asmob-data
  redisinsight:
    name: asmdev-redisinsight-data
  openobserve_data_dev:
    name: asmdev-openobserve-data
  clamav_data_dev:
    name: asmdev-clamav-data
